[project]
name = "ai-retrofit-playbook"
version = "1.0.0"
description = "Seven patterns for retrofitting LLM features into software that already has users, a schema, and a budget."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amin Ale", email = "amin.ale.business@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
